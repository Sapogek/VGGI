<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./SurfaceModel.js"></script> 
<script src="./shader.gpu"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>


<div id="controls">
    <h3>Контроль параметрів поверхні</h3>
    
    <label for="pInput">Коефіцієнт p (Товщина трубки):</label>
    <input type="number" id="pInput" value="0.1" step="0.01" min="0.01" oninput="updateSurface()"><br> 
    
    <label for="mInput">Коефіцієнт m (Загальний радіус спіралі):</label>
    <input type="number" id="mInput" value="0.1" step="0.01" min="0.01" oninput="updateSurface()"><br>
    
    <label for="uMaxInput">U Max (Довжина спіралі):</label>
    <input type="number" id="uMaxInput" value="12.57" step="0.1" min="1" oninput="updateSurface()"><br>
    
    <label for="vMaxInput">V Max (&pi; множник):</label>
    <input type="number" id="vMaxInput" value="2" step="0.1" min="0.1" oninput="updateSurface()"><br>
    
    <label for="vSegmentsInput">Кількість U/V-сегментів (Деталізація):</label>
    <input type="number" id="vSegmentsInput" value="50" step="1" min="10" oninput="updateSurface()"><br>

</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>

</body></html>
