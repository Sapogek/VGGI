<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#2</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./SurfaceModel.js"></script> 
<script src="./shader.gpu"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

<div id="controls">
    <h3>Контроль параметрів поверхні</h3>

    <label for="pInput">Коефіцієнт p (Товщина трубки):</label>
    <input type="range" id="pInput" min="0.01" max="0.5" value="0.1" step="0.01" oninput="updateSurface()">
    <span id="pValue">0.1</span><br> 
    
    <label for="mInput">Коефіцієнт m (Загальний радіус спіралі):</label>
    <input type="range" id="mInput" min="0.01" max="0.5" value="0.1" step="0.01" oninput="updateSurface()">
    <span id="mValue">0.1</span><br>
    
    <label for="uMaxInput">U Max (Довжина спіралі):</label>
    <input type="range" id="uMaxInput" min="3.14" max="25.13" value="12.57" step="0.1" oninput="updateSurface()">
    <span id="uMaxValue">12.57</span><br> 
    
    <label for="vMaxInput">V Max (π множник):</label>
    <input type="range" id="vMaxInput" min="0.5" max="4" value="2" step="0.1" oninput="updateSurface()">
    <span id="vMaxValue">2</span><br>
    <h4>Контроль гранулярності (деталізації)</h4>

    <label for="numUSlider">Гранулярність U:</label>
    <input type="range" id="numUSlider" min="10" max="100" value="50" step="1" oninput="updateGranularity('U')">
    <span id="numUValue">50</span><br>

    <label for="numVSlider">Гранулярність V:</label>
    <input type="range" id="numVSlider" min="10" max="100" value="50" step="1" oninput="updateGranularity('V')">
    <span id="numVValue">50</span><br>
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>

</body></html>
